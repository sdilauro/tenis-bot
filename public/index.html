<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>BOTenis</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>
  <div class="container">
    <div id="login-status" class="status"></div>

    <!-- New Reservation -->
    <section class="card">
      <h2>Nueva Reserva</h2>
      <div class="form-row-half">
        <div class="form-group">
          <label>Nombre (referencia)</label>
          <input type="text" id="res-name" placeholder="Ej: Tenis martes noche">
        </div>
        <div class="form-group">
          <label>Recurrencia</label>
          <select id="res-recurring">
            <option value="1" selected>Semanal</option>
            <option value="0">Única</option>
          </select>
        </div>
      </div>

      <div class="form-row-half">
        <div class="form-group">
          <label>Modo</label>
          <select id="cant-jugadores" onchange="updatePlayerFields()">
            <option value="2">Single</option>
            <option value="4">Double</option>
          </select>
        </div>
        <div class="form-group">
          <label>Día</label>
          <select id="res-dia">
            <option value="">-- Seleccionar --</option>
            <option value="1">Lunes</option>
            <option value="2">Martes</option>
            <option value="3">Miércoles</option>
            <option value="4">Jueves</option>
            <option value="5">Viernes</option>
            <option value="6">Sábado</option>
            <option value="0">Domingo</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Opción 1 (prioridad)</label>
        <div class="form-row-half" style="margin-bottom:0">
          <div class="form-group">
            <select id="res-cancha1">
              <option value="">-- Cancha --</option>
            </select>
          </div>
          <div class="form-group">
            <input type="time" id="res-hora1" step="900">
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>Opción 2 (alternativa)</label>
        <div class="form-row-half" style="margin-bottom:0">
          <div class="form-group">
            <select id="res-cancha2">
              <option value="">-- Cancha --</option>
            </select>
          </div>
          <div class="form-group">
            <input type="time" id="res-hora2" step="900">
          </div>
        </div>
      </div>

      <div id="schedule-info" class="schedule-info"></div>

      <div class="form-group">
        <label>Jugadores</label>
        <div id="players-container">
          <div class="player-row player-row-fixed">
            <input type="text" id="player1-name" class="player-fixed" readonly placeholder="Cargando...">
            <input type="hidden" id="player1-id">
          </div>
          <div class="player-row">
            <input type="text" class="player-search" placeholder="Buscar jugador (mín 3 letras)..." data-index="2">
            <select class="player-select" data-index="2"><option value="">-- Buscar primero --</option></select>
          </div>
        </div>
      </div>

      <button onclick="saveReservation()" class="btn-primary">Guardar Reserva</button>
      <button onclick="togglePush()" id="push-btn" class="btn-secondary" style="width:100%;margin-top:8px">Activar Notificaciones</button>
      <p id="push-ios-hint" class="push-hint" style="display:none">En iOS, primero agregá la app a la pantalla de inicio y abrila desde ahí.</p>
      <div id="save-status" class="status"></div>
      <div id="push-status" class="status"></div>
    </section>

    <!-- Saved Reservations -->
    <section class="card">
      <h2>Reservas Guardadas</h2>
      <div id="reservations-list"></div>
    </section>

    <!-- Logs -->
    <section class="card">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
        <h2 style="margin:0;flex:1">Logs</h2>
        <button onclick="loadLogs()" class="btn-secondary" style="padding:8px 16px">Actualizar</button>
        <button onclick="clearLogs()" class="btn-danger" style="padding:8px 16px">Borrar logs</button>
      </div>
      <div id="logs-list"></div>
    </section>

    <footer style="text-align:center;padding:16px 0;color:#64748b;font-size:0.85em">
      App creada por <a href="https://github.com/sdilauro" target="_blank" style="color:#93c5fd">sdilauro</a>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
